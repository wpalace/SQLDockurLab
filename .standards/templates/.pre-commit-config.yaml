# Template for consuming projects: copy to .pre-commit-config.yaml, delete the
# sections for languages you don't use, then run `pre-commit install`.
# Hook versions match the CI workflow in standards-check.yml.
exclude: ^\.standards/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]

  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Bash
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write, -i, "2", -ci, -bn]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Terraform (needs terraform and tflint on PATH)
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--minimum-failure-severity=notice

  # Docker and Compose
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # PowerShell and C# (need pwsh with PSScriptAnalyzer, and the .NET 10 SDK, on PATH)
  - repo: local
    hooks:
      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        language: system
        files: \.(ps1|psm1|psd1)$
        entry: pwsh -NoProfile -File .standards/scripts/Test-PowerShellStandard.ps1
      - id: dotnet-format
        name: dotnet format
        language: system
        files: \.cs$
        pass_filenames: false
        entry: dotnet format --verify-no-changes --verbosity minimal
