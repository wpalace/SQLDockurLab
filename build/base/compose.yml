# Stage 1: build the generalized Windows Server 2025 Core base image with dockur.
# Driven by `./lab build-base`. Runs once (~20-40 min); the VM syspreps itself and
# powers off, which stops the container. Watch progress at http://127.0.0.1:8006
name: sqlaglab-base
services:
  base:
    image: ${LAB_DOCKUR_IMAGE:-docker.io/dockurr/windows:latest}
    container_name: lab-base-build
    restart: "no"
    environment:
      VERSION: "2025"
      EDITION: "core"
      USERNAME: "labbuild"
      PASSWORD: ${LAB_PASSWORD}
      RAM_SIZE: "4G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      DISK_FMT: "qcow2"
      # Same virtual hardware classes as the runtime image (virtio-scsi + virtio-net),
      # so the drivers dockur injects are exactly the ones the runtime needs.
      DISK_TYPE: "scsi"
      ADAPTER: "virtio-net-pci"
      BOOT_MODE: "windows"
      HOST: "LABBASE"
      LOG: "Y"
      REMOVE: "N"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add: [NET_ADMIN]
    ports:
      - "127.0.0.1:8006:8006"
    volumes:
      - ${LAB_IMAGES_DIR:-../../images}/base-build:/storage
      - ./oem:/oem
      - ./shared:/shared
    stop_grace_period: 2m
